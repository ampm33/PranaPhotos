  <!-- MAIN -->
  <main id="main">
    <div class="container">
      <!-- HERO -->
      <section class="contact-hero">
        <h1 class="reveal">GET IN TOUCH</h1>
        <p class="sub reveal">FOR INQUIRIES, BOOKINGS, OR JUST TO SAY HELLO.</p>
      </section>

      <!-- FORM -->
      <section class="contact-form-section reveal" aria-labelledby="contact-form-heading">
        <h2 id="contact-form-heading" class="sr-only">Contact form</h2>

        <form action="https://formspree.io/f/XXXXYYYY" method="POST">
          <div class="form-row">
            <div class="field">
              <label for="name">NAME</label>
              <input id="name" name="name" type="text" placeholder="YOUR NAME" autocomplete="name" required />
            </div>

            <div class="field">
              <label for="email">EMAIL</label>
              <input id="email" name="email" type="email" placeholder="YOUR@EMAIL.COM" autocomplete="email" inputmode="email" required />
            </div>
          </div>

          <div class="field">
            <label for="subject">SUBJECT</label>
            <input id="subject" name="subject" type="text" placeholder="PROJECT INQUIRY" required />
          </div>

          <div class="field">
            <label for="message">MESSAGE</label>
            <textarea id="message" name="message" rows="5" placeholder="TELL ME ABOUT YOUR VISION..." required></textarea>
          </div>

          <input type="hidden" name="_subject" value="New PranaPhotos Contact Form Submission" />

          <div class="honeypot" aria-hidden="true">
            <label for="website">WEBSITE</label>
            <input id="website" type="text" name="_gotcha" tabindex="-1" autocomplete="off" />
          </div>

          <div class="form-submit">
            <button class="btn-send" type="submit">SEND MESSAGE</button>
            <p class="form-note">IF THE FORM FAILS, EMAIL ME DIRECTLY AT <a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="540406151a1518110d1510061d141319151d187a171b19">[email&#160;protected]</a></p>
          </div>
        </form>
      </section>

      <!-- GALLERY STRIP -->
      <section class="gallery-strip reveal">
        <div class="gallery-strip-grid">
          <div class="strip-img"></div>
          <div class="strip-img"></div>
          <div class="strip-img"></div>
          <div class="strip-img"></div>
        </div>
      </section>
    </div>
  </main>
